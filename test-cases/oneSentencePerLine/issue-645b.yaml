switchesViaYaml:
  mSwitch: 1
  rSwitch: 1

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  environments:
    DBSFinishesWithLineBreak: 1
  mandatoryArguments:        
    resumeItem:
      RCuBStartsOnOwnLine: -1  # <!--- NEW
  oneSentencePerLine:
    manipulateSentences: 1          
    sentencesFollow:
      rightBrace: 0  

specialBeginEnd:
  - name: resumeBegEnd
    begin: \\resumeItemListStart
    end: \\resumeItemListEnd
    nested: 1
